<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/theme-assets/tovu-theme/icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/theme-assets/tovu-theme/icons/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/theme-assets/tovu-theme/icons/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/theme-assets/tovu-theme/icons/apple-touch-icon.png" />
<link rel="manifest" href="/theme-assets/tovu-theme/manifest.webmanifest" />
<meta name="theme-color" content="#020203" />
<title>Sign in — Tovu</title>
<link rel="stylesheet" href="../css/theme.css" />
<script src="../scripts/theme-toggle.js"></script>
</head>
<body>

<!-- Marker: shared header (render/partials/nav.html) replaces this line. "current":"signin" highlights the fallback nav link with data-nav-id="signin". -->
<div data-embed-config='{"type":"partial","id":"nav","current":"signin"}'></div>

<main class="auth-wrap" data-kui="fade-up 600ms expo-out distance:18px on:enter threshold:0.15">
  <h1>Welcome back</h1>
  <p class="lede">Sign in to your Basic dashboard.</p>

  <form onsubmit="return false;">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn btn-solid btn-block btn-lg" style="margin-top: 8px;">Sign in</button>
  </form>

  <div class="divider">or</div>
  <button type="button" class="btn btn-ghost btn-block">Continue with GitHub</button>

  <p class="auth-foot">Don't have an account? <a href="signup.html">Get started</a></p>
</main>

<!-- Marker: shared footer, "minimal" variant (footer-minimal.html, named in theme.json slots) replaces this line. -->
<div data-embed-config='{"type":"partial","id":"footer","variant":"minimal"}'></div>

<script src="../scripts/main.js"></script>
<script src="../scripts/vendor/kuinetic.all.js"></script>
</body>
</html>
