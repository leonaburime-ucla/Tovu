<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/theme-assets/tovu-theme/icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="/theme-assets/tovu-theme/icons/favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/theme-assets/tovu-theme/icons/favicon-32x32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/theme-assets/tovu-theme/icons/apple-touch-icon.png" />
<link rel="manifest" href="/theme-assets/tovu-theme/manifest.webmanifest" />
<meta name="theme-color" content="#020203" />
<!-- Fixed 2026-08-11 (was a disclosed limitation: every post through this template shared one
     fixed tab/SEO title). The tag directly below now carries the same literal placeholder
     `page-shell.html` already used — `injectPageTitle` (static-render.ts) substitutes it with the
     current entity's own title before render, the same string-substitution idea
     `injectPostEmbedId` applies to a marker's own id attribute. See that function's own doc for why
     the match is scoped to the exact tag and must never be echoed as literal text elsewhere in this
     file (doing so once shadowed the real tag and silently ate the substitution). -->
<title>{{title}}</title>
<link rel="stylesheet" href="../css/theme.css" />
<script src="../scripts/theme-toggle.js"></script>
</head>
<body>

<!-- Marker: shared header (render/partials/nav.html) replaces this line. "current":"blog" highlights the fallback nav link with data-nav-id="blog". -->
<div data-embed-config='{"type":"partial","id":"nav","current":"blog"}'></div>

<main>
  <!-- Deliberately no `threshold:` token, and there must never be one again. kUInetic hands
       `threshold:` straight to IntersectionObserver, where it is a fraction of THIS element's OWN
       area, not of the viewport — so anything taller than `viewport / threshold` can never reach it.
       And a deferred (`on:enter`) reveal compiles to `animation-fill-mode: both` +
       `animation-play-state: paused`, which makes `kui-in-up`'s `from { opacity: 0 }` the element's
       RESTING style until the observer fires: an unsatisfiable threshold does not merely skip the
       animation, it leaves the whole page body permanently invisible. This wrapper holds author
       content, so its height is unbounded and 0 (an unset threshold) is the only value that is
       satisfiable at every height. See NOTICE.md, "Why the page wrappers carry no threshold:". -->
  <article class="post-detail wrap" data-kui="fade-up 600ms expo-out distance:18px on:enter">
    <!-- Marker: the body of the page or post at this URL goes inside this element. -->
    <div data-embed-config='{"type":"content"}'></div>
  </article>
</main>

<!-- Marker: shared footer (render/partials/footer.html) replaces this line. -->
<div data-embed-config='{"type":"partial","id":"footer"}'></div>

<script src="../scripts/main.js"></script>
<script src="../scripts/vendor/kuinetic.all.js"></script>
</body>
</html>
